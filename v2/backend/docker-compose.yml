services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: trabalhoamigo_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trabalhoamigo

  nginx:
    image: nginx:1.27-alpine
    container_name: trabalhoamigo_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - trabalhoamigo

  postgres:
    image: postgres:16-alpine
    container_name: trabalhoamigo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-trabalhoamigo}
      POSTGRES_USER: ${DB_USERNAME:-trabalhoamigo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-trabalhoamigo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trabalhoamigo

networks:
  trabalhoamigo:
    driver: bridge

volumes:
  postgres_data:
